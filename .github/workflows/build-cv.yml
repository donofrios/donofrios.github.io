name: Build CV

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "_data/**"
      - "_bibliography/papers.bib"
      - "cv-latex/**"
      - "scripts/build_cv.py"
      - ".github/workflows/build-cv.yml"

permissions:
  contents: write
  actions: write

jobs:
  build-cv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install generator dependencies
        run: python3 -m pip install --quiet pyyaml

      - name: Render dynamic sections from YAML data
        run: python3 scripts/build_cv.py

      - name: Compile CV, no-publications CV, and publication list with latexmk + biber
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            main.tex
            main_nopub.tex
            publist.tex
          working_directory: cv-latex
          latexmk_use_xelatex: false
          latexmk_use_lualatex: false

      - name: Assemble PDFs and LaTeX-project zip
        run: |
          mkdir -p assets/pdf
          cp cv-latex/main.pdf assets/pdf/CV.pdf
          cp cv-latex/main_nopub.pdf assets/pdf/CV_NoPub.pdf
          cp cv-latex/publist.pdf assets/pdf/PubList.pdf

          zip_root="$(mktemp -d)/cv-latex"
          mkdir -p "$zip_root"
          cp cv-latex/main.tex "$zip_root/"
          cp cv-latex/main_nopub.tex "$zip_root/"
          cp cv-latex/publist.tex "$zip_root/"
          cp cv-latex/publist_contributions.tex "$zip_root/"
          cp cv-latex/Bibliography.bib "$zip_root/"
          cp cv-latex/github_icon.png "$zip_root/"
          cp cv-latex/inspire_icon.jpg "$zip_root/"
          cp cv-latex/README.md "$zip_root/"
          cp -r cv-latex/generated "$zip_root/"
          ( cd "$(dirname "$zip_root")" && zip -r cv_latex.zip cv-latex >/dev/null )
          mv "$(dirname "$zip_root")/cv_latex.zip" assets/pdf/cv_latex.zip

      - name: Commit and redeploy if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/pdf/CV.pdf assets/pdf/CV_NoPub.pdf assets/pdf/PubList.pdf assets/pdf/cv_latex.zip
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "Auto-build CV/publication-list PDFs and cv_latex.zip"
            git push
            gh workflow run "Deploy site" --ref main
          fi

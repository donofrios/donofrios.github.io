# Feeds the OUTREACH ACTIVITIES section of cv-latex/main.tex (scripts/build_cv.py).
# Reverse-chronological order; render as listed (no auto-sort).
# Values are raw LaTeX (CV-only file, never rendered to HTML).
#
# Schema:
#   preamble: LaTeX sentence shown once under the section heading, or null
#   entries:
#     - title:       LaTeX
#       date_range:  e.g. "26/9/2025" or "2023 -- 2025"
#       description: LaTeX

preamble: "(All of the following activities were performed during my PhD in Spain and all of them have been done in Spanish.)"

entries:
  - title: "MAGNET Project"
    date_range: "2023 -- 2025"
    description: "I was part of the Magnet project which consists of a Spanish campaign to link research institutes to primary schools with social problems. I organized and carried out various activities with classes of young kids about various topics of physics during all the duration of the project."

  - title: "Workshop at \\textit{Researchers' night} in UAB"
    date_range: "26/9/2025"
    description: "Organised an activity at the UAB University for the Resercher's night in which we presented basic concepts of General Relativity to the participants of the event."

  - title: "Workshop at \\textit{Festa de la Ciencia} in Barcelona"
    date_range: "31/5/2025"
    description: "Together with Jorge Riviero, we organised an activity at the science fair of the municipality of Barcelona named \\textit{\"Life and death of stars\"}, in particular I explained the formation of black holes and their properties."

  - title: "Lecture \\textit{Ciencia en el Barrio}"
    date_range: "20/3/2025"
    description: 'Together with Michele Lenzi, we organised a lecture with the CSIC (Spanish national research institute) to explain General Relativity and Cosmology to students of the High School "IES Miquel Tarradell" of Barcelona. The students then went to the National Fair of "Ciencia en el Barrio" in Sevilla (one of the biggest outreach events in Spain) to present what they learned from the activity.'

  - title: "Lecture \\textit{Ciencia en el Barrio}"
    date_range: "14/3/2025"
    description: 'Together with Michele Lenzi, we organised a lecture with the CSIC (Spanish national research institute) to explain General Relativity, Black Holes and Gravitational Waves to students of the High School "Institut Front Marítim" of Barcelona.'

  - title: "Workshop at \\textit{Resercher's night} in UAB"
    date_range: "27/9/2024"
    description: "Together with Michele Lenzi, we organised an activity at the UAB University for the Resercher's night in which we presented basic concepts of General Relativity to the participants of the event."

  - title: "Workshop \\textit{Ciencia en el Barrio}"
    date_range: "9/6/2024"
    description: "Together with Jorge Riviero, we organised a workshop with the CSIC (Spanish national research institute) to explain the Dark Universe to the people of the city."

  - title: "Workshop at \\textit{Saló de l'Ensenyament}, Barcelona's annual fair"
    date_range: "13/3/2024"
    description: "Together with Jorge Riviero, we organised a workshop on Black Holes at the Barcelona's annual university fair."
